# See https://fly.io/docs/launch/continuous-deployment-with-github-actions/

name: Fly Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - dev_MedicalChatBot

permissions:
  contents: read

env:
  FLY_APP: rag-chatbot-wild-tidepool-9132

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: fly-deploy-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config fly.toml --app "$FLY_APP"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
